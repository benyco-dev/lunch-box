<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>점심 뭐 먹지?</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>🍱 점심 뭐 먹지?</h1>
    <p id="status" class="muted"></p>
  </header>

  <main>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="roulette">🎯 룰렛</button>
      <button role="tab" aria-selected="false" data-tab="worldcup">🏆 메뉴 월드컵</button>
    </nav>

    <div id="chips" class="chips" aria-label="종목"></div>

    <section id="roulette" class="panel">
      <p id="roulette-hint" class="hint"></p>
      <div id="grid" class="grid"></div>
      <div class="row">
        <button id="spin" class="btn primary">돌리기</button>
        <button id="reshuffle" class="btn">식당 섞기</button>
      </div>
    </section>

    <section id="worldcup" class="panel" hidden>
      <div id="wc"></div>
    </section>

    <section id="result" class="panel" hidden aria-live="polite">
      <p id="result-label" class="muted"></p>
      <h2 id="result-title"></h2>
      <div id="map" hidden></div>
      <ul id="places"></ul>
    </section>
  </main>

  <footer class="muted">식당 정보: 카카오 로컬 · 지도: © OpenStreetMap</footer>
</body>
</html>
